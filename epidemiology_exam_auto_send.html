<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Epidemiology MCQ Exam</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--bg:#f3f7f6;--surface:#fff;--ink:#14292b;--muted:#5b7073;--line:#cfdcda;--accent:#0e6b66;--accent-ink:#fff;--sel:#dff1ee;--good:#17724a;--goodbg:#e2f4ea;--bad:#a72b2b;--badbg:#fbe6e4;color-scheme:light;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1b1c;--surface:#152728;--ink:#e6f1ef;--muted:#93aeab;--line:#2a4344;--accent:#4cc2b8;--accent-ink:#06211f;--sel:#1d3a3a;--good:#6fd6a0;--goodbg:#173a2b;--bad:#ff9c94;--badbg:#3f1f1e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1b1c;--surface:#152728;--ink:#e6f1ef;--muted:#93aeab;--line:#2a4344;--accent:#4cc2b8;--accent-ink:#06211f;--sel:#1d3a3a;--good:#6fd6a0;--goodbg:#173a2b;--bad:#ff9c94;--badbg:#3f1f1e;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.9rem;line-height:1.2;margin:0 0 8px}
p{margin:0 0 14px}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
label{display:block;font-weight:700;margin:16px 0 6px}
input[type=text],select{width:100%;font:inherit;color:inherit;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1.5px solid var(--accent);padding:12px 20px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent;color:var(--accent)}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 18px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.top{display:flex;justify-content:space-between;gap:12px;font-size:.95rem;color:var(--muted)}
.q{font-size:1.2rem;font-weight:700;margin:0 0 16px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);margin-bottom:10px;font-weight:400;padding:13px 14px}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.9rem}
.opt.sel{background:var(--sel);border-color:var(--accent)}
.opt.sel b{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.score{font-size:3rem;font-weight:700;line-height:1.1;margin:4px 0}
.rev{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;background:var(--surface)}
.rev.ok{border-left:6px solid var(--good)}.rev.no{border-left:6px solid var(--bad)}
.rev p{margin:0 0 8px;font-weight:700}
.ans{font-size:.98rem;margin:2px 0}
.ans.c{color:var(--good);font-weight:700}.ans.w{color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.tabs button{padding:8px 14px}
.hide{display:none}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main class="wrap">

<section id="start" class="card">
  <h1>Epidemiology MCQ Exam</h1>
  <p class="muted">Each question has one correct answer. Questions appear in a random order. There is no time limit. You see your score and the correct answers when you finish.</p>
  <label for="name">Your name</label>
  <input id="name" type="text" autocomplete="name" placeholder="Full name">
  <label for="count">Number of questions</label>
  <select id="count"></select>
  <p id="err" class="hide" style="color:var(--bad);margin-top:12px">Enter your name to start.</p>
  <div class="row"><button id="go">Start exam</button></div>
</section>

<section id="exam" class="hide">
  <div class="top"><span id="who"></span><span id="prog"></span></div>
  <div class="bar"><i id="fill"></i></div>
  <div class="card">
    <p class="q" id="qtext"></p>
    <div id="opts"></div>
  </div>
  <div class="nav">
    <button class="ghost" id="prev">Previous</button>
    <button id="next">Next</button>
  </div>
  <p class="muted" style="margin-top:18px" id="answered"></p>
</section>

<section id="result" class="hide">
  <div class="card">
    <p class="muted" id="rwho"></p>
    <div class="score" id="rscore"></div>
    <p id="rline"></p>
    <p id="sent" class="muted" aria-live="polite"></p>
    <div class="row">
      <button id="retry" class="hide">Send again</button>
      <button id="copy" class="ghost">Copy my result</button>
      <button class="ghost" id="again">Take again</button>
    </div>
    <p id="copied" class="muted hide"></p>
  </div>
  <h2 style="margin:26px 0 10px;font-size:1.25rem">Review</h2>
  <div class="row tabs">
    <button id="tAll">All</button>
    <button class="ghost" id="tWrong">Wrong or skipped</button>
  </div>
  <div id="review"></div>
</section>

</main>

cohort"],"a":2},{"n":149,"q":"The main advantage of community intervention trials is:","o":["Applied at population level","Randomized at patient level","Short-term only","No control group needed"],"a":0},{"n":150,"q":"Which bias can be reduced by masking outcome assessors?","o":["Selection bias","Recall bias","Observer bias","Randomization bias"],"a":2},{"n":151,"q":"Which epidemiology type uses experiments on populations?","o":["Descriptive","Analytical","Experimental","Clinical"],"a":2},{"n":152,"q":"John Snow is famous for studying which disease outbreak?","o":["Tuberculosis","Cholera","Smallpox","Typhoid"],"a":1},{"n":153,"q":"Epidemiology is mainly concerned with:","o":["Lab diagnosis","Population health patterns","Anatomy","Physiology"],"a":1},{"n":154,"q":"Incidence measures are especially useful for:","o":["New cases","Old cases","Both","Carriers only"],"a":0},{"n":155,"q":"Prevalence measures are especially useful for:","o":["Mortality","Burden of chronic diseases","Acute infections only","Risk factors only"],"a":1},{"n":156,"q":"Which is an example of an endemic disease?","o":["Cholera in London, 1854","Malaria in Africa","HIV pandemic","COVID-19 worldwide spread"],"a":1},{"n":157,"q":"Which disease has been globally eradicated?","o":["Polio","Smallpox","Malaria","TB"],"a":1},{"n":158,"q":"Which study is best for rare exposures?","o":["Case-control","Cohort","Cross-sectional","Ecological"],"a":1},{"n":159,"q":"Which study is best for rare diseases?","o":["Case-control","Cohort","Cross-sectional","Ecological"],"a":0},{"n":160,"q":"Which type of study cannot establish temporality?","o":["Cohort","RCT","Cross-sectional","Experimental"],"a":2},{"n":161,"q":"Isolation is applied to:","o":["Healthy exposed persons","Infected patients","Carriers only","Vectors"],"a":1},{"n":162,"q":"Quarantine is applied to:","o":["Healthy persons exposed to infection","Sick persons","Only carriers","Whole populations"],"a":0},{"n":163,"q":"Which is an advantage of descriptive studies?","o":["Quick and inexpensive","Establish causal relationships","Randomization","Eliminate bias completely"],"a":0},{"n":164,"q":"An epidemic curve shows:","o":["Distribution of disease cases over time","Genetic patterns","Cause of outbreak","Host immunity only"],"a":0},{"n":165,"q":"A point epidemic curve indicates:","o":["Single exposure outbreak","Person-to-person spread","Long-term epidemic","Sporadic outbreak"],"a":0},{"n":166,"q":"A propagated epidemic curve suggests:","o":["Single source","Continuous exposure","Person-to-person transmission","Eradication"],"a":2},{"n":167,"q":"Which of the following is an occupational disease?","o":["Tuberculosis in miners","Malaria in Africa","Typhoid fever","Polio"],"a":0},{"n":168,"q":"Carrier state is important in transmission of:","o":["Typhoid","Malaria","Cholera","All of the above"],"a":3},{"n":169,"q":"Passive immunity is obtained by:","o":["Vaccination","Breastfeeding (maternal antibodies)","Infection recovery","Exposure to pathogen"],"a":1},{"n":170,"q":"Active immunity is obtained by:","o":["Antibody injection","Vaccination or natural infection","Maternal transfer","Blood transfusion"],"a":1},{"n":171,"q":"Which is NOT part of the epidemiologic triad?","o":["Host","Agent","Environment","Immunity alone"],"a":3},{"n":172,"q":"An endemic disease in a population has:","o":["Zero incidence","Constant presence","Rapid explosive spread","Worldwide distribution"],"a":1},{"n":173,"q":"In an epidemic curve, a wide plateau indicates:","o":["Common source outbreak","Continuous exposure","Eradication","Pandemic"],"a":1},{"n":174,"q":"Which is the denominator of incidence density?","o":["Total population","Person-time at risk","Mid-year population","Live births"],"a":1},{"n":175,"q":"Case fatality rate is useful for measuring:","o":["Prevalence","Severity of disease","Mortality burden","Immunity levels"],"a":1},{"n":176,"q":"Infant mortality rate is widely used as:","o":["Health indicator of a community","Maternal health only","Clinical tool","Randomized measure"],"a":0},{"n":177,"q":"A high maternal mortality ratio reflects:","o":["Poor obstetric care","Strong health system","High life expectancy","Good nutrition"],"a":0},{"n":178,"q":"Which is an advantage of cross-sectional studies?","o":["Measure prevalence","Establish causality","Useful for rare diseases","Good for temporality"],"a":0},{"n":179,"q":"Nested case-control studies save resources by:","o":["Reducing time and cost","Including all population","Avoiding exposure measurement","Eliminating controls"],"a":0},{"n":180,"q":"Selection bias in cohort studies is also called:","o":["Observer bias","Loss to follow-up bias","Recall bias","Confounding"],"a":1},{"n":181,"q":"The main limitation of ecological studies is:","o":["Ecological fallacy","High cost","Time-consuming","Too much precision"],"a":0},{"n":182,"q":"Case-control studies use which statistical measure?","o":["Relative risk","Odds ratio","Incidence density","Prevalence ratio"],"a":1},{"n":183,"q":"Cohort studies use which measure of association?","o":["Relative risk","Odds ratio","Prevalence ratio","Mortality ratio"],"a":0},{"n":184,"q":"In RCT, blinding is used to prevent:","o":["Selection bias","Observer bias","Recall bias","Survival bias"],"a":1},{"n":185,"q":"Triple blinding means:","o":["Subjects, investigators, and data analysts unaware of assignments","Only patients unaware","Patients and investigators aware","Only analysts blinded"],"a":0},{"n":186,"q":"A placebo is used to:","o":["Increase incidence","Blind participants","Eliminate controls","Bias exposure"],"a":1},{"n":187,"q":"Which study has the highest validity for causality?","o":["Case-control","Cross-sectional","Cohort","RCT"],"a":3},{"n":188,"q":"Which method can control confounding?","o":["Randomization","Stratification","Matching","All of the above"],"a":3},{"n":189,"q":"The main advantage of prospective cohort studies is:","o":["Clear temporal sequence","Short duration","Low cost","Suitable for rare diseases"],"a":0},{"n":190,"q":"The 'gold standard' study design is:","o":["Cross-sectional","Cohort","RCT","Ecological"],"a":2},{"n":191,"q":"In an epidemic curve, repeated peaks suggest:","o":["Point source","Propagated epidemic","Continuous exposure","Eradication"],"a":1},{"n":192,"q":"If 50 cases occurred in 2000 persons over 1 year, incidence = ?","o":["25/1000","50/1000","2.5/100","Both a and c"],"a":3},{"n":193,"q":"If prevalence = incidence × duration, which factor mainly increases prevalence?","o":["Shorter duration","Longer survival without cure","Higher case fatality","Outmigration of cases"],"a":1},{"n":194,"q":"Secondary attack rate excludes:","o":["Index case","Secondary cases","Contacts at risk","Population not exposed"],"a":0},{"n":195,"q":"Information bias includes all EXCEPT:","o":["Misclassification bias","Observer bias","Recall bias","Selection bias"],"a":3},{"n":196,"q":"If relative risk = 1, it means:","o":["No association between exposure and disease","Exposure causes disease","Protective effect","High risk"],"a":0},{"n":197,"q":"If RR < 1, it means:","o":["No association","Risk factor","Protective effect","Bias"],"a":2},{"n":198,"q":"If incidence in exposed = 40/200 and unexposed = 10/200, the relative risk = ?","o":["2","3","4","5"],"a":2},{"n":199,"q":"Odds ratio approximates relative risk when:","o":["Disease is rare","Disease is common","Case-control design","Both a and c"],"a":3},{"n":200,"q":"Randomization in RCT mainly controls for:","o":["Known and unknown confounders","Selection bias only","Recall bias only","Observer bias"],"a":0}]</script>
<script>
(function(){
var BANK=JSON.parse(document.getElementById('data').textContent);
var L=['A','B','C','D'];
var $=function(i){return document.getElementById(i)};
var SHEET_URL='PASTE_YOUR_WEB_APP_URL_HERE';
var exam=[],ans=[],cur=0,student='',payload=null;

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function show(id){['start','exam','result'].forEach(function(s){$(s).classList.toggle('hide',s!==id)});window.scrollTo(0,0)}

var sizes=[20,50,100].filter(function(n){return n<BANK.length});sizes.push(BANK.length);
$('count').innerHTML=sizes.map(function(n){return '<option value="'+n+'">'+(n===BANK.length?'All '+n:n)+'</option>'}).join('');
$('count').value=String(BANK.length);

$('go').onclick=function(){
  var n=$('name').value.trim();
  if(!n){$('err').classList.remove('hide');$('name').focus();return}
  student=n;
  exam=shuffle(BANK).slice(0,parseInt($('count').value,10));
  ans=exam.map(function(){return -1});cur=0;
  $('who').textContent=student;
  show('exam');render();
};
function render(){
  var q=exam[cur];
  $('qtext').textContent=(cur+1)+'. '+q.q;
  $('prog').textContent='Question '+(cur+1)+' of '+exam.length;
  $('fill').style.width=((cur+1)/exam.length*100)+'%';
  var h='';
  q.o.forEach(function(o,i){
    h+='<button class="opt'+(ans[cur]===i?' sel':'')+'" data-i="'+i+'" aria-pressed="'+(ans[cur]===i)+'"><b>'+L[i]+'</b><span></span></button>';
  });
  $('opts').innerHTML=h;
  var sp=$('opts').querySelectorAll('.opt span');
  q.o.forEach(function(o,i){sp[i].textContent=o});
  $('prev').disabled=cur===0;
  var last=cur===exam.length-1;
  $('next').textContent=last?'Finish exam':'Next';
  var done=ans.filter(function(a){return a>=0}).length;
  $('answered').textContent=done+' of '+exam.length+' answered';
}
$('opts').onclick=function(e){
  var b=e.target.closest('.opt');if(!b)return;
  ans[cur]=parseInt(b.getAttribute('data-i'),10);render();
};
$('prev').onclick=function(){if(cur>0){cur--;render()}};
$('next').onclick=function(){
  if(cur<exam.length-1){cur++;render();return}
  var left=ans.filter(function(a){return a<0}).length;
  if(left&&!confirm('You have '+left+' unanswered question'+(left>1?'s':'')+'. Finish anyway?'))return;
  finish();
};

var summary='';
function finish(){
  var ok=0;exam.forEach(function(q,i){if(ans[i]===q.a)ok++});
  var pct=Math.round(ok/exam.length*100);
  $('rwho').textContent=student;
  $('rscore').textContent=ok+' / '+exam.length;
  $('rline').textContent=pct+'% correct, '+(exam.length-ok)+' wrong or skipped.';
  summary='Epidemiology MCQ Exam\nName: '+student+'\nScore: '+ok+'/'+exam.length+' ('+pct+'%)';
  $('copied').classList.add('hide');
  var wrong=[];exam.forEach(function(q,i){if(ans[i]!==q.a)wrong.push(q.n)});
  payload={name:student,score:ok,total:exam.length,percent:pct,wrong:wrong};
  renderReview(false);show('result');send();
}
function send(){
  var st=$('sent'),rb=$('retry');rb.classList.add('hide');
  if(SHEET_URL.indexOf('https://')!==0){st.textContent='Your result was not sent because the Google Sheet is not connected yet. Tap Copy my result and send it to your teacher.';return}
  st.textContent='Sending your result…';
  fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})
   .then(function(){st.textContent='Your result was sent to your teacher.'})
   .catch(function(){st.textContent='Could not send. Check your internet, then tap Send again.';rb.classList.remove('hide')});
}
$('retry').onclick=send;
function renderReview(onlyWrong){
  var h='';
  exam.forEach(function(q,i){
    var good=ans[i]===q.a;
    if(onlyWrong&&good)return;
    h+='<div class="rev '+(good?'ok':'no')+'"><p></p><div class="ans '+(good?'c':'w')+'"></div>'+(good?'':'<div class="ans c"></div>')+'</div>';
  });
  $('review').innerHTML=h||'<p class="muted">Nothing here. Every answer was correct.</p>';
  var els=$('review').querySelectorAll('.rev'),k=0;
  exam.forEach(function(q,i){
    var good=ans[i]===q.a;
    if(onlyWrong&&good)return;
    var el=els[k++],a=el.querySelectorAll('.ans');
    el.querySelector('p').textContent=(i+1)+'. '+q.q;
    a[0].textContent=(good?'Correct: ':'Your answer: ')+(ans[i]<0?'Not answered':L[ans[i]]+') '+q.o[ans[i]]);
    if(a[1])a[1].textContent='Correct answer: '+L[q.a]+') '+q.o[q.a];
  });
  $('tAll').className=onlyWrong?'ghost':'';$('tWrong').className=onlyWrong?'':'ghost';
}
$('tAll').onclick=function(){renderReview(false)};
$('tWrong').onclick=function(){renderReview(true)};
$('copy').onclick=function(){
  var m=$('copied');
  function ok(){m.textContent='Copied. Send it to your teacher.';m.classList.remove('hide')}
  function no(){m.textContent=summary.replace(/\n/g,' | ');m.classList.remove('hide')}
  try{navigator.clipboard.writeText(summary).then(ok,no)}catch(e){no()}
};
$('again').onclick=function(){show('start')};
})();
</script>
</body>
</html>
